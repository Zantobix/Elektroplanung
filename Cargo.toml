[package]
name = "elektroplanung"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Zantobix/Elektroplanung"
description = "Unabhängiger Nachbau der Planungssoftware Elektroplanung (MD Evolution) in Rust"

[[bin]]
name = "Elektroplanung"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "links"] }

egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Schriftmetrik (wie egui) und Einbetten der Schriften ins PDF (beide schon über egui bzw. image im Abhängigkeitsbaum)
skrifa = { version = "0.44", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3

[lib]
name = "elektroplanung"
path = "src/lib.rs"

# Linux: Fensteranbindung für X11 und Wayland (unter Windows/macOS nicht nötig)
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "links", "x11", "wayland"] }
# Wayland (GNOME zeichnet keine Fensterrahmen): Rahmen im Adwaita-Stil mit Titel und üblichen Knöpfen statt des
# schlichten grauen Rahmens ohne Titel
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# Windows: Programmsymbol und Versionsangaben in die Exe einbetten (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
