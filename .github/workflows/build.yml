# Bauen, testen und veröffentlichen auf Linux, macOS und Windows.
#
# Die Version steht nur an EINER Stelle: `version` in Cargo.toml. Tags werden nie von Hand gesetzt.
# - Pull Request: bauen + testen, Programme als Artefakte an der Ausführung
#   (Windows: einzelne .exe, Linux: .AppImage, macOS: .dmg mit der App)
# - Push auf main: ebenso; ist die Version aus Cargo.toml neu (noch kein Tag v<Version>), legt die Pipeline
#   nach erfolgreichem Bauen das Tag v<Version> und ein GitHub-Release mit den drei Programmen an.
#   Text des Releases: der Abschnitt "## [<Version>]" aus CHANGELOG.md.
# - Push auf main ohne neue Version: das Vorab-Release "entwicklung" (Tag `entwicklung`) wird durch den neuen
#   Stand ERSETZT – so gibt es immer einen aktuellen Download. Veröffentlichte Versionen bleiben unverändert.
name: Bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version aus Cargo.toml, gibt es das Tag schon?
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "Version $V ist bereits veröffentlicht"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
            echo "Version $V ist neu"
            if ! grep -q "^## \[$V\]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::Abschnitt '## [$V]' fehlt (Version aus Cargo.toml)"
              exit 1
            fi
          fi

  bauen:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux auf der älteren Ubuntu-Version bauen: läuft dann auch auf älteren Distributionen (glibc)
          - os: ubuntu-22.04
            datei: Elektroplanung-${{ needs.version.outputs.version }}-x86_64.AppImage
          - os: macos-latest
            datei: Elektroplanung-${{ needs.version.outputs.version }}-macos-arm64.dmg
          - os: windows-latest
            datei: Elektroplanung-${{ needs.version.outputs.version }}-windows-x86_64.exe
            # C-Laufzeit fest einbinden: die Exe läuft ohne installiertes Visual-C++-Paket
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    env:
      DATEI: ${{ matrix.datei }}
      VERSION: ${{ needs.version.outputs.version }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Pakete (Fensteranbindung X11/Wayland)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Testen
        run: cargo test --release --locked
      - name: Bauen
        run: cargo build --release --locked

      - name: Windows – einzelne Exe
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/Elektroplanung.exe "$DATEI"

      - name: Linux – AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/Elektroplanung AppDir/usr/bin/
          cp resources/elektroplanung.png AppDir/elektroplanung.png
          ln -s usr/bin/Elektroplanung AppDir/AppRun
          cat > AppDir/elektroplanung.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Elektroplanung
          Comment=Schaltpläne mit Blättern, Symbolen, Leitungen und Schriftfeld
          Exec=Elektroplanung %f
          Icon=elektroplanung
          Categories=Graphics;Engineering;
          Terminal=false
          EOF
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "$DATEI"

      - name: macOS – App in einem Disk-Image
        if: runner.os == 'macOS'
        run: |
          APP=dmg/Elektroplanung.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/Elektroplanung "$APP/Contents/MacOS/"
          mkdir symbol.iconset
          for g in 16 32 128 256; do
            sips -z $g $g resources/elektroplanung.png --out symbol.iconset/icon_${g}x${g}.png > /dev/null
            sips -z $((g*2)) $((g*2)) resources/elektroplanung.png --out symbol.iconset/icon_${g}x${g}@2x.png > /dev/null
          done
          iconutil -c icns symbol.iconset -o "$APP/Contents/Resources/elektroplanung.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Elektroplanung</string>
            <key>CFBundleDisplayName</key><string>Elektroplanung</string>
            <key>CFBundleIdentifier</key><string>io.github.zantobix.elektroplanung</string>
            <key>CFBundleExecutable</key><string>Elektroplanung</string>
            <key>CFBundleIconFile</key><string>elektroplanung</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"
          ln -s /Applications dmg/Programme
          hdiutil create -volname Elektroplanung -srcfolder dmg -ov -format UDZO "$DATEI"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATEI }}
          path: ${{ env.DATEI }}

  release:
    needs: [version, bauen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Release-Text aus CHANGELOG.md
        run: |
          V="${{ needs.version.outputs.version }}"
          awk -v v="## [$V]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notizen.md
          [ -s notizen.md ] || echo "Version $V" > notizen.md
          cat notizen.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Elektroplanung ${{ needs.version.outputs.version }}
          body_path: notizen.md
          files: pakete/*

  # Aktueller Stand von main als Vorab-Release (wird bei jedem Push ersetzt, nie "Latest")
  entwicklung:
    needs: [version, bauen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.neu == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Vorab-Release "entwicklung" ersetzen
        run: |
          KURZ=$(echo "$GITHUB_SHA" | cut -c1-7)
          {
            echo "Automatisch gebauter Stand von \`main\` (Commit $KURZ, $(date -u +%Y-%m-%d)) – nicht getestet wie eine Version."
            echo
            awk 'index($0, "## [Unveröffentlicht]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md
          } > notizen.md
          gh release delete entwicklung --yes --cleanup-tag || true
          gh release create entwicklung pakete/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Entwicklungsstand ($KURZ)" --notes-file notizen.md
