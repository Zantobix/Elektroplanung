# macOS-Programm (.dmg) getrennt vom Workflow „Bauen“ (Nutzer 24.11.2026): GitHub hat zu wenige Mac-Rechner (Apple
# Silicon); ein Job, den kein Mac annimmt, wird nach ~15 min abgebrochen und färbt seinen Lauf rot. Deshalb:
# - startet nach jedem erfolgreichen Lauf von „Bauen“ auf main (oder von Hand),
# - prüft zuerst auf Linux, ob es zur Version aus Cargo.toml ein Release ohne .dmg gibt – nur dann wird ein Mac
#   angefordert (normale Pushes: nichts zu tun, grün),
# - baut, testet, hängt die .dmg an das Release und entfernt den Hinweis „wird nachgereicht“ aus dem Text.
# Von Hand gestartet (workflow_dispatch) baut er immer und legt die .dmg auch als Artefakt ab.
name: macOS

on:
  workflow_run:
    workflows: [Bauen]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pruefen:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      noetig: ${{ steps.p.outputs.noetig }}
      release: ${{ steps.p.outputs.release }}
      sha: ${{ steps.p.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: p
        name: Gibt es ein Release ohne .dmg?
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --json assets -q '.assets[].name' > assets.txt 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            if grep -q '\.dmg$' assets.txt; then echo "noetig=false" >> "$GITHUB_OUTPUT"; echo "v$V hat schon eine .dmg";
            else echo "noetig=true" >> "$GITHUB_OUTPUT"; echo "v$V ohne .dmg – Mac wird angefordert"; fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "noetig=true" >> "$GITHUB_OUTPUT"; else echo "noetig=false" >> "$GITHUB_OUTPUT"; fi
            echo "kein Release v$V"
          fi

  macos:
    needs: pruefen
    if: needs.pruefen.outputs.noetig == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      DATEI: Elektroplanung-${{ needs.pruefen.outputs.version }}-macos-arm64.dmg
      VERSION: ${{ needs.pruefen.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pruefen.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testen
        run: cargo test --release --locked
      - name: Bauen
        run: cargo build --release --locked
      - name: macOS – App in einem Disk-Image
        if: runner.os == 'macOS'
        run: |
          APP=dmg/Elektroplanung.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/Elektroplanung "$APP/Contents/MacOS/"
          mkdir symbol.iconset
          for g in 16 32 128 256; do
            sips -z $g $g resources/elektroplanung.png --out symbol.iconset/icon_${g}x${g}.png > /dev/null
            sips -z $((g*2)) $((g*2)) resources/elektroplanung.png --out symbol.iconset/icon_${g}x${g}@2x.png > /dev/null
          done
          iconutil -c icns symbol.iconset -o "$APP/Contents/Resources/elektroplanung.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Elektroplanung</string>
            <key>CFBundleDisplayName</key><string>Elektroplanung</string>
            <key>CFBundleIdentifier</key><string>io.github.zantobix.elektroplanung</string>
            <key>CFBundleExecutable</key><string>Elektroplanung</string>
            <key>CFBundleIconFile</key><string>elektroplanung</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"
          ln -s /Applications dmg/Programme
          hdiutil create -volname Elektroplanung -srcfolder dmg -ov -format UDZO "$DATEI"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATEI }}
          path: ${{ env.DATEI }}
      - name: An das Release anhängen, Hinweis entfernen
        if: needs.pruefen.outputs.release == 'true'
        run: |
          gh release upload "v$VERSION" "$DATEI" --clobber
          gh release view "v$VERSION" --json body -q .body | grep -v "macOS-Programm wird nachgereicht" > notizen.md
          gh release edit "v$VERSION" --notes-file notizen.md
